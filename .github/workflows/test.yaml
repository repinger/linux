name: Test Kernel Build

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        distro: [archlinux, debian, rhel]
    steps:
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install busybox-static cpio gzip qemu-kvm -y

      - name: Get initramfs script
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            .github/scripts/mkinitramfs.sh

      - name: Download bzimage artifact
        uses: actions/download-artifact@v8
        with:
          name: linux-custom-bzimage-${{ github.ref_name }}-${{ matrix.distro }}

      - name: Run initramfs script
        run: |
          sh .github/scripts/mkinitramfs.sh

      - name: Boot kernel in QEMU
        run: |
          sudo qemu-system-x86_64 \
            -kernel out/arch/x86_64/boot/bzImage \
            -initrd initramfs.cpio.gz \
            --enable-kvm \
            -cpu host \
            -m 256M \
            -nographic \
            -append "console=ttyS0 panic=-1"
